name: Commerce regression tests

on:
  pull_request:
  push:
    branches: [main, fix/payment-refund-stock-integrity]

permissions:
  contents: read

jobs:
  commerce:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: shoeverse_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: shoeverse.test_settings
      TEST_POSTGRES: "true"
      DB_NAME: shoeverse_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test shop wallet users --verbosity=2

  docker:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: docker-ci-only-key-not-for-production
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: docker compose exec -T -e TEST_POSTGRES=true web python manage.py test shop wallet users --settings=shoeverse.test_settings --verbosity=2
      - name: Container logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
